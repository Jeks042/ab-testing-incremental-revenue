name: Validate experiment data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and validate source data
        run: python scripts/download_data.py

      - name: Export experiment-integrity tables
        run: python scripts/run_validation.py

      - name: Upload validation tables
        uses: actions/upload-artifact@v7
        with:
          name: experiment-integrity-tables
          path: reports/tables/
          if-no-files-found: error
          retention-days: 30
