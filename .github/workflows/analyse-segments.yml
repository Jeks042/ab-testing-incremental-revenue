name: Analyse treatment differences and segments

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_segment_analysis.py"
      - "src/segment_analysis.py"
      - ".github/workflows/analyse-segments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse-segments:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and validate source data
        run: python scripts/download_data.py

      - name: Estimate direct and segment effects
        run: python scripts/run_segment_analysis.py

      - name: Upload segment analysis tables
        uses: actions/upload-artifact@v7
        with:
          name: treatment-and-segment-analysis-tables
          path: reports/segment_tables/
          if-no-files-found: error
          retention-days: 30
